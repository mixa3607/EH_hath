name: build-container
run-name: On push
on:
  push:
    branches:
      - '*'
jobs:
  Build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: mixa3607/eh_hath
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker buildx build \
            --build-arg CI_COMMIT_REF_NAME="${{ github.ref_name }}" \
            --build-arg CI_COMMIT_SHORT_SHA="${{ steps.short-sha.outputs.sha }}" \
            --build-arg CI_COMMIT_SHA="${{ github.sha }}" \
            --build-arg CI_REPOSITORY_URL="${{ github.event.repository.clone_url }}" \
            --build-arg CI_PROJECT_URL="${{ github.event.repository.html_url }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}_${{ steps.short-sha.outputs.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
            --push -f ./Dockerfile .
